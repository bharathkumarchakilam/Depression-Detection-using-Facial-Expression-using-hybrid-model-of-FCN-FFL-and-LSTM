<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depression Detection</title>
    <style>
        /* Global Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        form {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
        }

        input[type="file"] {
            display: block;
            margin: 10px ;
            width: 90%;
            padding: 4px 20px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            background-color: #ecf0f1;
        }
        
        select {
            display: block;
            margin: 10px ;
            
            padding: 4px 20px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            background-color: #ecf0f1;
        }
        input[type="submit"] {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        input[type="submit"]:hover {
            background-color: #34495e;
        }

        div {
            text-align: center;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background-color: #e74c3c;
            color: white;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
        }

        @media (max-width: 600px) {
            form {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div>
        <h1><strong>Depression Detection</strong></h1>
        <h1>Upload Image for Depression Detection</h1>
        <form method="POST" action="{{ url_for('upload_file') }}" enctype="multipart/form-data">
            
            <select name="model_type" required>
                <option value="FCN">FCN Model</option>
                <option value="FFL">FFL Model</option>
                <option value="LSTM">LSTM Model</option>
                <option value="HYBRID">HYBRID Model</option>
            </select>
            <input type="file" name="file" accept="image/*" required>
            <input type="submit" value="Upload">
        </form>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul>
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
    </div>
</body>
</html>
